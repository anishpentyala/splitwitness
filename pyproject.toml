[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "splitwitness"
version = "0.2.2"
description = "Offline transitive split-constraint audits with bounded witness paths"
authors = [{name = "Anish Pentyala"}]
keywords = ["machine-learning", "data-leakage", "csv", "data-validation"]
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"

[project.urls]
Homepage = "https://github.com/anishpentyala/splitwitness"
Repository = "https://github.com/anishpentyala/splitwitness"
Issues = "https://github.com/anishpentyala/splitwitness/issues"

[project.scripts]
splitwitness = "splitwitness.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py39"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
