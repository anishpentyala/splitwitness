[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "splitwitness"
version = "0.1.0"
description = "Offline transitive split-constraint audits with bounded witness paths"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"

[project.scripts]
splitwitness = "splitwitness.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py39"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
